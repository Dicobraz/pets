# Свой clippy.toml останавливает поиск вверх по каталогам: без него clippy берёт файл соседнего
# проекта (репозиторий лежит в папке Урфина) с его правилами.
# «Не падать»: в тестах unwrap/expect/panic! разрешены (в интеграционных тестах — `#![allow]` в начале файла).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
